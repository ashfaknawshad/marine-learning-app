# .github/workflows/keep-alive.yml

name: Supabase Keep-Alive

# This workflow will run on a schedule.
on:
  schedule:
    # Runs at 00:00 UTC every day.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  ping-supabase:
    name: Ping Supabase to Prevent Pausing
    runs-on: ubuntu-latest

    steps:
      - name: Make a simple API request to Supabase
        # We use `curl` to send a GET request.
        # We are asking for just the 'id' of one profile, which is a very small, fast, and harmless request.
        run: |
          curl -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
